name: structure

# Проверка структуры Vector Work: числа README и бейджей, контракты работников,
# границы прав, лицензия. Всё считается по дереву — устаревшее число роняет CI.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Сверка с апстримом — по расписанию, отдельным заданием (job upstream).
  schedule:
    - cron: "0 6 * * 1"     # понедельник 06:00 UTC

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна шагу S26: он сравнивает push с базой и считает
          # родителей merge-коммита.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимостей нет (только stdlib)
        run: python3 -c "import sys; print(sys.version)"

      - name: Валидатор структуры
        run: python3 scripts/validate_structure.py

      - name: S26 — журнал приёмки меняется только через PR
        # Защитный рубеж (план M2, шаг 3). Токен без admin + защита ветки уже не
        # пускают прямой push в master, но если защиту когда-нибудь ослабят, этот
        # шаг поймает главное: правку якоря приёмки мимо ревью.
        # Нормальные коммиты (не трогают approvals.jsonl) проходят свободно.
        if: github.event_name == 'push'
        run: |
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "первый push в ветку — сравнивать не с чем, пропускаем"
            exit 0
          fi
          if git diff --quiet "$base" "$head" -- profiles/approvals.jsonl; then
            echo "журнал приёмки в этом push не менялся — ок"
            exit 0
          fi
          # Журнал изменён: допускается ТОЛЬКО merge-коммит от PR (2+ родителей).
          parents=$(git rev-list --parents -n1 "$head" | wc -w)
          if [ "$parents" -ge 3 ]; then
            echo "журнал изменён merge-коммитом от PR ($((parents-1)) родителя) — ок"
            exit 0
          fi
          echo "::error::profiles/approvals.jsonl изменён прямым push в master без PR"
          echo "Журнал приёмки — якорь: его правка должна прийти через PR с ревью владельца."
          exit 1

      - name: Генераторы идемпотентны
        # Шаг ловит и созданный, и удалённый файл: раньше сравнивались только те
        # файлы, что были в бэкапе, поэтому новый контракт или его удаление
        # проходили незамеченными.
        #
        # ВАЖНО: git status сам по себе не годится — он показывает diff против
        # коммита, а не против предыдущего прогона, и в рабочем дереве с
        # незакоммиченными правками всегда непуст. Поэтому сравниваем снимок
        # файлов ДО и ПОСЛЕ прогона генераторов.
        run: |
          rm -rf /tmp/snap1 /tmp/snap2 && mkdir -p /tmp/snap1 /tmp/snap2
          cp profiles/*.md profiles/body-hashes.json profiles/registry.json profiles/approvals.jsonl /tmp/snap1/
          cp agents/orchestrator.md /tmp/snap1/
          python3 scripts/build_registry.py
          python3 scripts/build_contracts.py
          python3 scripts/build_reviews.py
          python3 scripts/build_readiness.py
          cp profiles/*.md profiles/body-hashes.json profiles/registry.json profiles/approvals.jsonl /tmp/snap2/
          cp agents/orchestrator.md /tmp/snap2/
          if ! diff -rq /tmp/snap1 /tmp/snap2; then
            echo "::error::генераторы не идемпотентны — второй прогон меняет дерево"
            exit 1
          fi
          echo "генераторы идемпотентны: повторный прогон не изменил ни одного файла"

      - name: Журнал приёмки генераторы не трогают
        # N1: approvals.jsonl — якорь приёмки, его пишет только человек. Если
        # генератор сумеет его изменить, приёмка снова станет самоодобряемой.
        run: |
          before=$(sha256sum profiles/approvals.jsonl | cut -d' ' -f1)
          python3 scripts/build_contracts.py >/dev/null
          python3 scripts/build_reviews.py >/dev/null
          after=$(sha256sum profiles/approvals.jsonl | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "::error::генератор изменил profiles/approvals.jsonl — приёмка самоодобряема"
            exit 1
          fi
          echo "журнал приёмки не меняется генераторами: $before"

      - name: Валидатор после генераторов
        run: python3 scripts/validate_structure.py

      - name: Мутационная проверка самого валидатора
        run: python3 scripts/mutation_check.py

      - name: Сводка приёмки
        # gate_status.py читает внешний human-gate из ~/.hermes, которого в CI нет.
        # Здесь сверяем приёмку по отпечаткам тел — то, что лежит в репозитории.
        run: python3 scripts/check_reviews.py

      - name: Бейдж синхронизации и лок согласованы
        # Лок закрепляет ревизию апстрима, бейдж её печатает. Расхождение не
        # требует сети для проверки — оба файла в репозитории (S22 это же ловит).
        run: python3 scripts/check_upstream.py --check

      - name: Скрипты не зависят от домашнего каталога
        # Класс дефекта: путь собирался от $HOME, локально совпадал, на раннере — нет.
        # Прогон на копии под другим HOME ловит это до пуша.
        run: |
          rm -rf /tmp/ci-home && mkdir -p /tmp/ci-home
          tar -cf - --exclude=.git . | (cd /tmp/ci-home && tar -xf -)
          cd /tmp/ci-home
          HOME=/tmp/ci-home-fake python3 scripts/build_registry.py >/dev/null
          HOME=/tmp/ci-home-fake python3 scripts/build_contracts.py >/dev/null
          HOME=/tmp/ci-home-fake python3 scripts/validate_structure.py
          echo "скрипты работают при чужом HOME"

  # Сверка с апстримом — ОТДЕЛЬНОЕ задание по расписанию. Расхождение с живым
  # апстримом не ошибка сборки: оно открывает issue, а не красит push.
  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сверить состав с апстримом
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_upstream.py --by-domain | tee /tmp/upstream.txt
          delta=$(python3 scripts/check_upstream.py --json | python3 -c "import sys,json; print(json.load(sys.stdin)['delta'])")
          echo "delta=$delta" >> "$GITHUB_OUTPUT"
      - name: Открыть issue при отставании копии
        if: steps.check.outputs.delta != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Копия ролей отстала от апстрима (delta=${{ steps.check.outputs.delta }})"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" | grep -q .; then
            echo "issue уже открыт — не дублирую"
            exit 0
          fi
          { echo 'Автоматическая сверка `scripts/check_upstream.py` нашла расхождение с апстримом.'; echo; echo '```'; cat /tmp/upstream.txt; echo '```'; echo; echo 'Это не ошибка сборки: копия отстаёт осознанно. Обновить дерево, пересобрать контракты и обновить бейдж `synced_upstream` в README.'; } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/body.md
